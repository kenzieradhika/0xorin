[platformio]
src_dir = esp32_marauder
test_dir = test

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = true
extra_scripts =
  pre:tools/native_coverage.py
build_src_filter =
  -<*>
  +<MarauderMacAddress.cpp>
  +<PcapHeader.cpp>
  +<Switches.cpp>
  +<DisplayLine.cpp>
  +<BeaconFrame.cpp>
  +<WdgResponse.cpp>
  +<FoxHuntTarget.cpp>
  +<TargetListSort.cpp>
  +<TDongleStats.cpp>
  +<IPv4Range.cpp>
  +<FirmwareMetadata.cpp>
  +<MenuMarquee.cpp>
  +<GpsTrackerStats.cpp>
  +<BootSplash.cpp>
  +<MenuInputRepeat.cpp>
  +<TDongleBus.cpp>
  +<RemoteIdModel.cpp>
  +<RemoteIdDecoder.cpp>
  +<MemoryGuard.cpp>
  +<CsiMotionModel.cpp>
  +<CensorText.cpp>
  +<StationSelection.cpp>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic
  --coverage
  -Itest/support

; 0xorin headless builds: WROOM-32D DevKitC & ESP32-S3 DevKitC (serial-only, HAS_SCREEN off)
[env:0xorin_esp32]
platform = espressif32
board = esp32dev
framework = arduino
src_dir = 0xorin_src
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0

[env:0xorin_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
src_dir = 0xorin_src
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
